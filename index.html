<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#D92643">
<title>오사카·교토 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#fff; --surface:#f4f5f7; --ink:#14171a; --sub:#5b6470; --line:#e1e4e8;
  --link:#1b3a8c; --on-day:#fff; --day:#D92643;
  --ok:#1a7f4b; --todo:#c2261f; --opt:#8a6a00;
  --display:"Do Hyeon","Pretendard Variable",sans-serif;
  --body:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
:root[data-theme="dark"]{
  --bg:#101214; --surface:#1a1d21; --ink:#f2f4f6; --sub:#a3acb8; --line:#2c3138;
  --link:#9db6ff; --ok:#6fd39b; --todo:#ff8f86; --opt:#e3c257;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);word-break:keep-all;
  padding-bottom:calc(64px + env(safe-area-inset-bottom))}
a{color:var(--link)}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}

/* 상단 색 띠 */
.band{background:var(--day);color:var(--on-day);transition:background-color .3s ease-in-out;padding-top:env(safe-area-inset-top)}
.band .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.band h1{font:400 24px/1 var(--display);margin:0;letter-spacing:.01em}
.band .meta{font-size:13px;font-weight:600;opacity:.95;display:flex;align-items:center;gap:10px}
.theme{background:none;border:1.5px solid currentColor;border-radius:8px;min-width:44px;min-height:32px;font-size:12px;font-weight:700;cursor:pointer}

/* 지금 / 다음 */
.now{padding:20px 0 18px;border-bottom:1px solid var(--line)}
.now .lab{font-size:13px;font-weight:700;color:var(--day)}
.now h2{font:400 clamp(30px,8.6vw,44px)/1.12 var(--display);margin:6px 0 6px}
.now .when{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.now p{margin:6px 0 0;color:var(--sub);font-size:14.5px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:8px;
  background:var(--link);color:var(--bg);font-weight:700;font-size:14.5px;text-decoration:none;border:0;cursor:pointer}
.btn.line{background:none;color:var(--link);border:1.5px solid var(--link)}

/* 날짜 선택 = 노선 */
.lines{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:14px 0}
.ln{border:0;background:var(--surface);border-radius:8px;padding:8px 2px 9px;cursor:pointer;text-align:center;line-height:1.25;
  border-bottom:4px solid var(--c)}
.ln b{display:block;font:400 19px/1.1 var(--display)}
.ln i{display:block;font-style:normal;font-size:11px;color:var(--sub);font-weight:600}
.ln span{display:block;font-size:11.5px;font-variant-numeric:tabular-nums;margin-top:3px}
.ln[aria-pressed="true"]{background:var(--c);color:#fff}
.ln[aria-pressed="true"] i{color:#fff;opacity:.9}
.ln.today b::after{content:" ●";font-size:9px;vertical-align:middle}

/* 하루 */
.dayhead{padding:6px 0 14px}
.dayhead h2{font:400 26px/1.15 var(--display);margin:0}
.dayhead h2 em{font-style:normal;color:var(--day)}
.wx{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:10px;font-size:14.5px}
.wx .ico{font-size:26px;line-height:1}
.wx b{font-size:19px;font-variant-numeric:tabular-nums}
.wx .rain{font-weight:700}
.wx .rain.wet{color:var(--todo)}
.wear{margin:6px 0 0;font-size:14px;color:var(--sub)}
.wear small{display:block;font-size:11.5px;margin-top:2px}

/* 노선도 타임라인 */
.rail{list-style:none;margin:0;padding:6px 0 0}
.rail li{position:relative;display:grid;grid-template-columns:58px 1fr;gap:0 36px;padding:0 0 22px}
.rail li::before{content:"";position:absolute;left:67px;top:0;bottom:0;width:6px;background:var(--day);opacity:.9}
.rail li:first-child::before{top:10px;border-radius:3px 3px 0 0}
.rail li:last-child::before{bottom:calc(100% - 16px);border-radius:0 0 3px 3px}
.rail li::after{content:"";position:absolute;left:62px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:4px solid var(--day)}
.rail li.next::after{background:var(--day);box-shadow:0 0 0 4px color-mix(in srgb,var(--day) 25%,transparent)}
.rail li.past{opacity:.5}
.rail .t{font-weight:800;font-size:15.5px;font-variant-numeric:tabular-nums;text-align:right;padding-top:2px;white-space:nowrap}
.rail h3{margin:0;font-size:17px;font-weight:700;line-height:1.35}
.rail p{margin:3px 0 0;font-size:14px;color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;align-items:center}
.st{font-size:12.5px;font-weight:800}
.st.ok{color:var(--ok)} .st.todo{color:var(--todo)} .st.opt{color:var(--opt)}
.st::before{content:"■ ";font-size:9px;vertical-align:1px}
.tags a{font-size:14px;font-weight:600;padding:6px 0;text-underline-offset:3px}
.stay{display:grid;grid-template-columns:58px 1fr;gap:0 36px;font-size:14px;padding:4px 0 8px}
.stay b{text-align:right;font-weight:800;color:var(--sub)}
.alt{margin:8px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px}
.alt summary{cursor:pointer;font-weight:700;padding:14px 0;color:var(--link);min-height:44px}
.alt dt{font-weight:700;margin-top:10px} .alt dd{margin:2px 0 0;color:var(--sub)} .alt dl{margin:0 0 14px}

/* 목록 탭 */
section.panel{display:none} section.panel.on{display:block}
.ptitle{font:400 26px/1.15 var(--display);margin:22px 0 4px}
.lead{color:var(--sub);font-size:14px;margin:0 0 6px}
.rows{list-style:none;margin:0;padding:0}
.rows>li{padding:16px 0;border-bottom:1px solid var(--line)}
.rows .top{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.rows h3{margin:4px 0 2px;font-size:17px}
.rows p{margin:0;font-size:14px;color:var(--sub)}
.rows .btn{margin-top:10px}
.check label{display:flex;gap:14px;align-items:flex-start;cursor:pointer;min-height:44px}
.check input{width:24px;height:24px;margin:1px 0 0;accent-color:var(--link);flex:none}
.check b{display:block;font-size:16px} .check span{display:block;font-size:13.5px;color:var(--sub)}
.check input:checked ~ div b{text-decoration:line-through;color:var(--sub)}
dl.kv{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14.5px}
dl.kv dt{color:var(--sub)} dl.kv dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
footer{color:var(--sub);font-size:12px;padding:24px 0 8px}

/* 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0 4px}
nav.tabs button{border:0;background:none;color:var(--sub);font-size:13.5px;font-weight:700;min-height:56px;cursor:pointer;border-top:3px solid transparent;margin-top:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--day)}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}

@media (min-width:900px){
  body{padding-bottom:40px}
  nav.tabs{position:static;border-top:0;border-bottom:1px solid var(--line)}
  nav.tabs .wrap{display:flex;gap:4px;padding:0 18px}
  nav.tabs button{padding:0 18px;min-height:48px;font-size:15px;border-top:0;border-bottom:3px solid transparent;margin:0 0 -1px}
  nav.tabs button[aria-selected="true"]{border-bottom-color:var(--day)}
  #plan.on{display:grid;grid-template-columns:360px 1fr;gap:0 56px;align-items:start}
  .side{position:sticky;top:0;padding-top:8px}
  .lines{grid-template-columns:1fr;gap:6px}
  .ln{display:grid;grid-template-columns:64px 1fr auto;align-items:center;text-align:left;padding:10px 14px;border-bottom:0;border-left:0;box-shadow:inset 6px 0 0 var(--c)}
  .ln b{padding-left:6px} .ln span{margin:0}
  .now{border-bottom:0}
  .main{padding-top:22px}
  .rows{max-width:720px}
}
@media (prefers-reduced-motion:reduce){.band{transition:none}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <h1>오사카·교토 4박 5일</h1>
  <div class="meta"><span id="dday"></span><button class="theme" id="theme" aria-label="밝기 전환">밝게</button></div>
</div></header>

<nav class="tabs" aria-label="메뉴"><div class="wrap" role="tablist">
  <button role="tab" data-tab="plan" aria-selected="true">일정</button>
  <button role="tab" data-tab="book" aria-selected="false">예약·링크</button>
  <button role="tab" data-tab="todo" aria-selected="false">체크리스트</button>
  <button role="tab" data-tab="info" aria-selected="false">항공·숙소</button>
</div></nav>

<main class="wrap">
  <section class="panel on" id="plan">
    <div class="side">
      <div class="now" id="now"></div>
      <div class="lines" id="lines" role="group" aria-label="날짜 선택"></div>
    </div>
    <div class="main" id="day"></div>
  </section>
  <section class="panel" id="book">
    <h2 class="ptitle">예약·링크</h2>
    <p class="lead">날짜순입니다. 빨간 표시가 아직 해야 하는 예약입니다.</p>
    <ul class="rows" id="bookings"></ul>
  </section>
  <section class="panel" id="todo">
    <h2 class="ptitle">체크리스트</h2>
    <p class="lead">체크 상태는 이 기기에만 저장됩니다.</p>
    <ul class="rows check" id="checks"></ul>
  </section>
  <section class="panel" id="info">
    <h2 class="ptitle">항공·숙소</h2>
    <p class="lead">예약번호와 정산 금액은 시트에서 확인합니다.</p>
    <ul class="rows" id="infos"></ul>
  </section>
  <footer>2026.11.27 (금) – 12.01 (화) · 3인 · 요금과 운영 시간은 방문 전 공식 페이지에서 확인</footer>
</main>

function outfit(hi,lo,pop){
  const top = hi>=20?"긴팔 셔츠에 얇은 겉옷":hi>=16?"긴팔에 가디건이나 얇은 자켓":hi>=12?"니트에 코트나 도톰한 자켓":"두꺼운 니트에 코트";
  const cold = lo<=5?" 아침·밤에는 목도리.":lo<=9?" 밤에는 한 겹 더.":"";
  const rain = pop>=60?" 우산 필수, 미끄럽지 않은 신발.":pop>=30?" 접이식 우산.":"";
  return top+"."+cold+rain;
}
const COLORS = ["#D92643","#C4500F","#0E7C6B","#1F6FD6","#9A6B00"]; // 도톤보리 네온, 교토 단풍, 오사카성 청록, 항만 파랑, 귀국 노을
const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const jst = ()=>{const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()).map(x=>[x.type,x.value]));return {date:`${p.year}-${p.month}-${p.day}`,min:(+p.hour%24)*60+ +p.minute}};
const mins = t => {const m=/^(\d{1,2}):(\d{2})$/.exec(t);return m?+m[1]*60+ +m[2]:null};
const md = d => {const [,m,dd]=d.split("-");return `${+m}/${+dd}`};
const now = jst(), todayIdx = DAYS.findIndex(d=>d.date===now.date);
let sel = todayIdx>=0?todayIdx:0;
const ms = d=>Date.parse(d+"T00:00:00+09:00");

// 다음 일정 찾기
function nextUp(){
  if(todayIdx<0){
    if(ms(now.date)<ms(DAYS[0].date)) return {state:"before",day:0,item:DAYS[0].items[0]};
    return {state:"after"};
  }
  const items=DAYS[todayIdx].items; let cur=null,nx=null;
  items.forEach(it=>{const m=mins(it.t); if(m==null) return; if(m<=now.min) cur=it; else if(!nx) nx=it;});
  if(nx) return {state:"during",day:todayIdx,item:nx,cur};
  if(todayIdx<DAYS.length-1) return {state:"tomorrow",day:todayIdx+1,item:DAYS[todayIdx+1].items[0],cur};
  return {state:"last",cur};
}
const UP = nextUp();

function linkBtns(it,max){return (it.links||[]).slice(0,max).map(([n,u],i)=>`<a class="btn${i?" line":""}" href="${u}" target="_blank" rel="noopener">${n}</a>`).join("")}
function drawNow(){
  const box=$("#now"); let h="";
  if(UP.state==="after"){ h=`<div class="lab">여행 종료</div><h2>수고했어요</h2><p>정산은 시트에서 마무리하면 됩니다.</p><div class="acts"><a class="btn" href="${SHEET}" target="_blank" rel="noopener">시트 열기</a></div>`; }
  else if(UP.state==="last"){ h=`<div class="lab">오늘 일정 끝</div><h2>${UP.cur?UP.cur.h:"귀국"}</h2><p>조심히 돌아가요.</p>`; }
  else{
    const it=UP.item, d=DAYS[UP.day];
    const lab = UP.state==="before" ? `출발까지 D-${Math.round((ms(d.date)-ms(now.date))/864e5)} · 첫 일정` : UP.state==="tomorrow" ? "내일 첫 일정" : "다음 일정";
    h=`<div class="lab">${lab}</div><h2>${it.h}</h2><div class="when">${md(d.date)} (${d.dow}) ${it.t}</div><p>${it.p}</p><div class="acts">${linkBtns(it,2)}</div>`;
    if(UP.state==="during"&&UP.cur) h+=`<p>지금: ${UP.cur.t} ${UP.cur.h}</p>`;
  }
  box.innerHTML=h;
}

function wxOf(d){const k=d.wx||"osaka", v=WX[k].d[d.date]; if(!v) return null; const [c,hi,lo,pop]=v,[ico,label]=sky(c); return {k,ico,label,hi:Math.round(hi),lo:Math.round(lo),pop,raw:v,live:WX[k].live}}
function drawLines(){
  $("#lines").innerHTML="";
  DAYS.forEach((d,i)=>{
    const w=wxOf(d), b=el("button","ln"+(i===todayIdx?" today":""),`<b>${md(d.date)}</b><i>${d.dow} · ${i+1}일차</i><span>${w?`${w.ico} ${w.hi}°/${w.lo}° ☔${w.pop}%`:""}</span>`);
    b.style.setProperty("--c",COLORS[i]); b.setAttribute("aria-pressed",i===sel);
    b.onclick=()=>{sel=i;render()}; $("#lines").append(b);
  });
}
function drawDay(){
  const d=DAYS[sel], w=wxOf(d), box=$("#day"); box.innerHTML="";
  const head=el("div","dayhead",`<h2><em>${sel+1}일차</em> ${d.area}</h2>`+(w?`<div class="wx"><span class="ico">${w.ico}</span><span>${WX[w.k].name} ${w.label}</span><b>${w.hi}° / ${w.lo}°</b><span class="rain${w.pop>=50?" wet":""}">☔ ${w.pop}%</span></div><p class="wear">🧥 ${outfit(...w.raw.slice(1))}<small>${w.live?"최신 예보 (Open-Meteo), 열 때마다 갱신":"11/24 기준 예보"}</small></p>`:""));
  box.append(head);
  const ul=el("ul","rail");
  d.items.forEach(it=>{
    const m=mins(it.t), isNext=UP.item===it, past=sel===todayIdx&&m!=null&&m<=now.min&&!isNext&&UP.cur!==it;
    const tags=(it.badge?`<span class="st ${it.badge[0]}">${it.badge[1]}</span>`:"")+(it.links||[]).map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n} ↗</a>`).join("");
    ul.append(el("li",(isNext?"next ":"")+(past?"past":""),`<div class="t">${it.t}</div><div><h3>${it.h}</h3><p>${it.p}</p>${tags?`<div class="tags">${tags}</div>`:""}</div>`));
  });
  box.append(ul);
  if(d.stay) box.append(el("div","stay",`<b>숙소</b><div>${d.stay} · <a href="${map(d.stay)}" target="_blank" rel="noopener">지도 ↗</a></div>`));
  if(d.alt) box.append(el("details","alt",`<summary>${d.alt.title}</summary><dl>${d.alt.rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>`));
}
function render(){
  document.documentElement.style.setProperty("--day",COLORS[sel]);
  document.querySelector('meta[name="theme-color"]').content=COLORS[sel];
  drawLines(); drawDay();
}
async function loadWx(){
  await Promise.all(Object.keys(WX).map(async k=>{
    try{
      const w=WX[k], u=`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16&past_days=7`;
      const r=await fetch(u); if(!r.ok) return; const x=(await r.json()).daily;
      x.time.forEach((t,i)=>{ if(w.d[t] && x.temperature_2m_max[i]!=null) w.d[t]=[x.weather_code[i],x.temperature_2m_max[i],x.temperature_2m_min[i],x.precipitation_probability_max[i]??0]; });
      w.live=true;
    }catch(e){}
  }));
  render();
}

  const li=el("li","",`<label><input type="checkbox" ${saved[k]?"checked":""}><div><b>${h}</b><span>${p}</span></div></label>`);
  $("input",li).onchange=e=>{saved[k]=e.target.checked;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(_){}};
  $("#checks").append(li);
});

// 탭
const tabs=[...document.querySelectorAll("nav.tabs button")];
function show(name,push){
  tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===name));
  document.querySelectorAll("section.panel").forEach(s=>s.classList.toggle("on",s.id===name));
  if(push){history.replaceState(null,"","#"+name);window.scrollTo({top:0})}
}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.tab,true));
const applyHash=()=>{const h=location.hash.slice(1); if(tabs.some(b=>b.dataset.tab===h)) show(h)};
applyHash(); addEventListener("hashchange",applyHash);

// 밝기: 기기 설정을 따르고, 버튼으로 바꾸면 이 기기에 기억
const TK="osaka2026-theme", root=document.documentElement, tbtn=$("#theme");
function setTheme(t){root.dataset.theme=t; tbtn.textContent=t==="dark"?"밝게":"어둡게";}
let th=null; try{th=localStorage.getItem(TK)}catch(e){}
setTheme(th||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
tbtn.onclick=()=>{const t=root.dataset.theme==="dark"?"light":"dark"; setTheme(t); try{localStorage.setItem(TK,t)}catch(e){}};
</script>
