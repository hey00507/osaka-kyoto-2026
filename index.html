<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<title>오사카·교토 2026</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#231d16; --sub:#6d6253; --line:#e4dbc9;
  --accent:#c8402a; --accent-ink:#fff; --soft:#f1e7d6;
  --ok:#2f7d4f; --ok-bg:#e3f1e7; --todo:#b3401f; --todo-bg:#fbe5dc; --opt:#8a6a12; --opt-bg:#f8edc9;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 8px 24px -12px rgba(60,40,10,.18);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16130f; --card:#201c16; --ink:#f1eadc; --sub:#a99c87; --line:#352e24;
    --accent:#ee6a4d; --accent-ink:#1a0e09; --soft:#2a241b;
    --ok:#7fd3a0; --ok-bg:#1c3326; --todo:#ff9a7c; --todo-bg:#40211a; --opt:#e6c766; --opt-bg:#3a3016;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));word-break:keep-all}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}

header.hero{padding:calc(28px + env(safe-area-inset-top)) 0 22px}
.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:700}
h1{font-size:clamp(30px,7vw,48px);line-height:1.1;margin:8px 0 10px;letter-spacing:-.03em;font-weight:800}
.hero p{margin:0;color:var(--sub)}
.dday{display:inline-flex;align-items:baseline;gap:8px;margin-top:16px;padding:8px 14px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
.dday b{font-size:18px;font-variant-numeric:tabular-nums}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0 6px}
nav.tabs button{appearance:none;border:0;background:none;color:var(--sub);font:inherit;font-size:13px;font-weight:600;
  padding:14px 4px 12px;cursor:pointer;border-top:2px solid transparent;margin-top:-1px}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
@media (min-width:820px){
  body{padding-bottom:40px}
  nav.tabs{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
  nav.tabs .wrap{display:flex;gap:6px;padding:0 18px}
  nav.tabs button{padding:14px 16px;border-top:0;border-bottom:2px solid transparent;margin:0 0 -1px;font-size:15px}
  nav.tabs button[aria-selected="true"]{border-bottom-color:var(--accent)}
}

section.panel{display:none;padding-top:22px}
section.panel.on{display:block}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
.lead{color:var(--sub);font-size:14px;margin:0 0 16px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 14px;margin:0 -18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;
  padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;text-align:left;line-height:1.3}
.chip small{display:block;color:var(--sub);font-size:11px}
.chip.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

.day{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  margin-bottom:18px;overflow:hidden;scroll-margin-top:70px}
.day.today{border-color:var(--accent)}
.day-head{display:flex;gap:14px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.num{flex:none;width:52px;height:52px;border-radius:16px;background:var(--soft);display:grid;place-items:center;
  font-weight:800;font-size:20px;line-height:1;color:var(--accent)}
.num small{display:block;font-size:10px;font-weight:700;color:var(--sub);margin-top:3px;text-align:center}
.day-head h3{margin:0;font-size:18px;letter-spacing:-.02em}
.day-head p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.tl{list-style:none;margin:0;padding:6px 18px 12px}
.tl li{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border-bottom:0}
.t{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--sub);padding-top:2px}
.tl h4{margin:0;font-size:15.5px;font-weight:700;line-height:1.4}
.tl p{margin:3px 0 0;font-size:13.5px;color:var(--sub)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.b-ok{color:var(--ok);background:var(--ok-bg)} .b-todo{color:var(--todo);background:var(--todo-bg)} .b-opt{color:var(--opt);background:var(--opt-bg)}
.link{font-size:12.5px;font-weight:600;text-decoration:none;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink)}
.link:hover{border-color:var(--accent);color:var(--accent)}
.wx{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--soft);font-size:13.5px}
.wx b{font-size:15px;font-variant-numeric:tabular-nums}
.wx .sky{font-weight:700;margin-right:8px}
.wx .rain{color:var(--sub);margin-left:8px}
.wx p{margin:4px 0 0;color:var(--ink)}
.wx small{display:block;margin-top:4px;color:var(--sub);font-size:11.5px}
.alt{margin:0 18px 14px;border:1px dashed var(--line);border-radius:14px;padding:0 14px;font-size:13.5px}
.alt summary{cursor:pointer;font-weight:700;padding:12px 0;color:var(--accent)}
.alt dl{margin:0 0 12px;display:block}
.alt dt{font-weight:700;color:var(--ink);margin-top:10px}
.alt dd{margin:2px 0 0;font-weight:400;color:var(--sub)}
.stay{padding:12px 18px;background:var(--soft);font-size:13.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stay a{font-weight:600}

.grid{display:grid;gap:14px}
@media (min-width:820px){.grid{grid-template-columns:1fr 1fr}.days{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.days .day{margin:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.card h3{margin:8px 0 4px;font-size:16.5px}
.card p{margin:0;font-size:13.5px;color:var(--sub)}
.card .when{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.02em}
.btn{display:inline-block;margin-top:12px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;
  font-size:13.5px;padding:9px 14px;border-radius:12px}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.check{list-style:none;margin:0;padding:0}
.check li{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.check label{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;cursor:pointer}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.check b{display:block;font-size:15px;font-weight:700}
.check span{display:block;font-size:13px;color:var(--sub)}
.check input:checked ~ div b{text-decoration:line-through;color:var(--sub)}
.note{font-size:12.5px;color:var(--sub);margin-top:14px}
dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
dt{color:var(--sub)} dd{margin:0;font-weight:600}
footer{color:var(--sub);font-size:12px;padding:26px 0 10px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">OSAKA · KYOTO</div>
    <h1>오사카·교토<br>4박 5일</h1>
    <p>2026.11.27 (금) – 12.01 (화) · 3인</p>
    <div class="dday" id="dday"></div>
  </header>
</div>

<nav class="tabs" aria-label="메뉴"><div class="wrap" role="tablist">
  <button role="tab" data-tab="plan" aria-selected="true">일정</button>
  <button role="tab" data-tab="book" aria-selected="false">예약·링크</button>
  <button role="tab" data-tab="todo" aria-selected="false">체크리스트</button>
  <button role="tab" data-tab="info" aria-selected="false">항공·숙소</button>
</div></nav>

<main class="wrap">
  <section class="panel on" id="plan">
    <div class="chips" id="chips"></div>
    <div class="days" id="days"></div>
  </section>

  <section class="panel" id="book">
    <h2>예약·링크</h2>
    <p class="lead">날짜순입니다. 빨간 표시가 아직 해야 하는 예약입니다.</p>
    <div class="grid" id="bookings"></div>
  </section>

  <section class="panel" id="todo">
    <h2>체크리스트</h2>
    <p class="lead">체크 상태는 이 기기에만 저장됩니다.</p>
    <ul class="check" id="checks"></ul>
  </section>

  <section class="panel" id="info">
    <h2>항공·숙소</h2>
    <p class="lead">예약번호와 정산 금액은 시트에서 확인합니다.</p>
    <div class="grid" id="infos"></div>
  </section>

  <footer>마지막 업데이트 2026.11.24 · 요금과 운영 시간은 방문 전 공식 페이지에서 확인</footer>
</main>

// 날씨: 11/24 기준 예보를 기본값으로 두고, 열 때마다 최신 예보로 갱신
const WX = {
 osaka:{lat:34.6937,lon:135.5023,name:"오사카",d:{"2026-11-27":[53,18.4,7.9,47],"2026-11-28":[53,18.3,10.4,76],"2026-11-29":[2,12.5,5.8,6],"2026-11-30":[0,13.6,3.8,0],"2026-12-01":[1,16.4,5.3,0]}},
 kyoto:{lat:35.0116,lon:135.7681,name:"교토",d:{"2026-11-27":[51,17.7,6.9,40],"2026-11-28":[81,18.6,7.7,80],"2026-11-29":[51,11.1,3.0,30],"2026-11-30":[0,13.8,1.5,0],"2026-12-01":[0,17.0,3.6,0]}}
};
const sky = c => c===0?"맑음":c===1?"대체로 맑음":c===2?"구름 조금":c===3?"흐림":c<50?"안개":c<60?"약한 비":c<70?"비":c<80?"눈":c<83?"소나기":c<90?"눈":"뇌우";
function outfit(hi,lo,pop){
  const top = hi>=20?"긴팔 셔츠에 얇은 겉옷":hi>=16?"긴팔에 가디건이나 얇은 자켓":hi>=12?"니트에 코트나 도톰한 자켓":"두꺼운 니트에 코트";
  const cold = lo<=5?" 아침·밤에는 목도리.":lo<=9?" 밤에는 한 겹 더.":"";
  const rain = pop>=60?" 우산 필수, 미끄럽지 않은 신발.":pop>=30?" 접이식 우산.":"";
  return top+"."+cold+rain;
}
function drawWx(date,loc,live){
  const box=document.getElementById("wx-"+date), v=WX[loc].d[date]; if(!box||!v) return;
  const [c,hi,lo,pop]=v;
  box.innerHTML=`<span class="sky">${WX[loc].name} · ${sky(c)}</span><b>${Math.round(hi)}°</b> / ${Math.round(lo)}°<span class="rain">비 올 확률 ${pop}%</span><p>${outfit(hi,lo,pop)}</p><small>${live?"최신 예보 (Open-Meteo)":"11/24 기준 예보"}</small>`;
}
async function loadWx(){
  await Promise.all(Object.keys(WX).map(async k=>{
    try{
      const w=WX[k], u=`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=16&past_days=7`;
      const r=await fetch(u); if(!r.ok) return; const x=(await r.json()).daily;
      x.time.forEach((t,i)=>{ if(w.d[t] && x.temperature_2m_max[i]!=null) w.d[t]=[x.weather_code[i],x.temperature_2m_max[i],x.temperature_2m_min[i],x.precipitation_probability_max[i]??0]; });
      w.live=true;
    }catch(e){}
  }));
  DAYS.forEach(d=>{const k=d.wx||"osaka"; drawWx(d.date,k,WX[k].live);});
}

const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const jstToday = ()=> new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo"}).format(new Date());
const today = jstToday();

// D-day
(()=>{const ms=d=>Date.parse(d+"T00:00:00+09:00"),now=ms(today),s=ms(DAYS[0].date),e=ms(DAYS.at(-1).date);
  const box=$("#dday");
  if(now<s) box.innerHTML="출발까지 <b>D-"+Math.round((s-now)/864e5)+"</b>";
  else if(now<=e) box.innerHTML="여행 <b>"+(Math.round((now-s)/864e5)+1)+"일차</b>";
  else box.textContent="여행 종료";})();

// 일정
DAYS.forEach((d,i)=>{
  const [,m,dd]=d.date.split("-"), isToday=d.date===today, id="day"+(i+1);
  const chip=el("button","chip"+(isToday?" today":""),`${+m}/${+dd} (${d.dow})<small>${i+1}일차 · ${d.area.split(" ")[0]}</small>`);
  chip.onclick=()=>document.getElementById(id).scrollIntoView({block:"start"});
  $("#chips").append(chip);
  const card=el("article","day"+(isToday?" today":"")); card.id=id;
  card.append(el("div","day-head",`<div class="num"><div>${+dd}<small>${+m}월 ${d.dow}</small></div></div><div><h3>${i+1}일차 · ${d.area}</h3><p>${isToday?"오늘":""}</p></div>`));
  const wx=el("div","wx"); wx.id="wx-"+d.date; card.append(wx);
  const ul=el("ul","tl");
  d.items.forEach(it=>{
    const extras=(it.badge?`<span class="badge b-${it.badge[0]}">${it.badge[1]}</span>`:"")+
      (it.links||[]).map(([n,u])=>`<a class="link" href="${u}" target="_blank" rel="noopener">${n} ↗</a>`).join("");
    ul.append(el("li","",`<div class="t">${it.t}</div><div><h4>${it.h}</h4><p>${it.p}</p>${extras?`<div class="row">${extras}</div>`:""}</div>`));
  });
  card.append(ul);
  if(d.alt) card.append(el("details","alt",`<summary>${d.alt.title}</summary><dl>${d.alt.rows.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("")}</dl>`));
  if(d.stay) card.append(el("div","stay",`<span>숙소 · ${d.stay}</span><a href="${map(d.stay)}" target="_blank" rel="noopener">지도 ↗</a>`));
  $("#days").append(card);
});

DAYS.forEach(d=>drawWx(d.date,d.wx||"osaka",false)); loadWx();

].forEach(h=>$("#infos").append(el("div","card",h)));

// 탭
const tabs=[...document.querySelectorAll("nav.tabs button")];
function show(name,push){
  tabs.forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===name));
  document.querySelectorAll("section.panel").forEach(s=>s.classList.toggle("on",s.id===name));
  if(push){history.replaceState(null,"","#"+name);window.scrollTo({top:0})}
}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.tab,true));
const start=location.hash.slice(1); if(tabs.some(b=>b.dataset.tab===start)) show(start);
addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(tabs.some(b=>b.dataset.tab===h)) show(h)});
// 여행 중이면 오늘 카드로 이동
const idx=DAYS.findIndex(d=>d.date===today);
if(idx>0 && !start) requestAnimationFrame(()=>document.getElementById("day"+(idx+1)).scrollIntoView({block:"start"}));
</script>
